<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>librarian</title>
<style>
  :root {
    --bg:#0e0f12; --panel:#16181d; --line:#262a31; --text:#e7e9ee; --dim:#8b909b;
    --accent:#7aa2ff; --move:#7aa2ff; --quarantine:#e0a85b; --ok:#5fd08a; --bad:#ff6b6b;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font:14px/1.5 ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif; }
  header { padding:18px 24px; border-bottom:1px solid var(--line); display:flex;
    align-items:baseline; gap:16px; }
  header h1 { margin:0; font-size:18px; letter-spacing:.04em; font-weight:600; }
  header .root { color:var(--dim); font-size:12px; font-family:ui-monospace,monospace; }
  main { max-width:1100px; margin:0 auto; padding:24px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:16px 18px; margin-bottom:18px; }
  .row { display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  button { background:var(--accent); color:#0b0d12; border:0; border-radius:7px;
    padding:8px 16px; font-weight:600; cursor:pointer; }
  button.secondary { background:#2a2f39; color:var(--text); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  label { color:var(--dim); display:inline-flex; gap:6px; align-items:center; }
  input[type=text] { background:#0e0f12; border:1px solid var(--line); color:var(--text);
    border-radius:6px; padding:6px 9px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:7px 9px; border-bottom:1px solid var(--line);
    vertical-align:top; }
  th { color:var(--dim); font-weight:500; }
  td.path { font-family:ui-monospace,monospace; font-size:12px; }
  .arrow { color:var(--dim); }
  .badge { font-size:11px; padding:1px 7px; border-radius:999px; font-weight:600; }
  .badge.move { background:rgba(122,162,255,.16); color:var(--move); }
  .badge.quarantine { background:rgba(224,168,91,.16); color:var(--quarantine); }
  .reason { color:var(--dim); }
  .banner { padding:10px 14px; border-radius:8px; margin-bottom:14px; }
  .banner.ok { background:rgba(95,208,138,.12); color:var(--ok); border:1px solid rgba(95,208,138,.3); }
  .banner.bad { background:rgba(255,107,107,.1); color:var(--bad); border:1px solid rgba(255,107,107,.3); }
  .dropzone { border:1.5px dashed var(--line); border-radius:10px; padding:26px; text-align:center;
    color:var(--dim); cursor:pointer; }
  .dropzone.over { border-color:var(--accent); color:var(--text); }
  pre { white-space:pre-wrap; background:#0e0f12; border:1px solid var(--line); border-radius:8px;
    padding:14px; font-size:12px; max-height:340px; overflow:auto; }
  .muted { color:var(--dim); font-size:12px; }
  .runs li { display:flex; gap:12px; align-items:center; padding:6px 0; border-bottom:1px solid var(--line);
    font-size:13px; font-family:ui-monospace,monospace; }
  .spacer { flex:1; }
</style>
</head>
<body>
<div id="root"></div>
<script>
// Self-contained, dependency-free SPA. No CDN, no build step, no in-browser
// transpile — this is a local-only tool and must render with zero network
// beyond its own API, so it can't lean on unpkg/React/Babel being reachable.
"use strict";

// --- tiny DOM helper: h(tag, props, ...children) ---------------------------
function h(tag, props) {
  const el = document.createElement(tag);
  if (props) {
    for (const k in props) {
      const v = props[k];
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "style" && typeof v === "object") Object.assign(el.style, v);
      else if (k.slice(0, 2) === "on" && typeof v === "function")
        el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === "checked" || k === "disabled" || k === "value" || k === "multiple") el[k] = v;
      else el.setAttribute(k, v);
    }
  }
  for (let i = 2; i < arguments.length; i++) append(el, arguments[i]);
  return el;
}
function append(el, kid) {
  if (kid == null || kid === false || kid === true) return;
  if (Array.isArray(kid)) { kid.forEach((k) => append(el, k)); return; }
  el.appendChild(kid.nodeType ? kid : document.createTextNode(String(kid)));
}

// --- API -------------------------------------------------------------------
async function api(path, opts) {
  const res = await fetch(path, opts);
  let body = null;
  try { body = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error((body && body.detail) || (res.status + " " + res.statusText));
  return body;
}

// --- state -----------------------------------------------------------------
const state = {
  cfg: null, mode: "cleanup", organize: true, playlist: "New This Week",
  instruction: "", plan: null, kept: new Set(), backup: true, runs: [], busy: false, msg: null,
};

// --- views -----------------------------------------------------------------
function organizePanel(s) {
  if (s.cfg && s.cfg.ai_available === false) {
    return h("div", { class: "panel" },
      h("div", { class: "muted" },
        "AI organize is off — set ANTHROPIC_API_KEY and install the .[ai] extra to "
        + "describe changes in plain English. The cleanup mode below works without it."));
  }
  return h("div", { class: "panel" },
    h("div", { class: "row" },
      h("input", { type: "text", value: s.instruction,
        placeholder: "Describe how to organize — e.g. put all Avicii in Festival/, quarantine the _spotdown rips",
        style: { flex: "1", minWidth: "320px" },
        onInput: (e) => { s.instruction = e.target.value; },
        onKeydown: (e) => { if (e.key === "Enter") organize(); } }),
      h("button", { onClick: organize, disabled: s.busy }, s.busy ? "Thinking…" : "Plan it")),
    h("div", { class: "muted", style: { marginTop: "8px" } },
      "AI proposes a plan from your words; you review every row and Apply — it never changes files directly."));
}

function modeBar(s) {
  const radios = ["plan", "cleanup", "inbox"].map((m) =>
    h("label", null,
      h("input", { type: "radio", name: "mode", checked: s.mode === m,
        onChange: () => { s.mode = m; render(); } }), " " + m));
  return h("div", { class: "panel" },
    h("div", { class: "row" },
      radios,
      h("label", null,
        h("input", { type: "checkbox", checked: s.organize,
          onChange: (e) => { s.organize = e.target.checked; } }), " organize by genre"),
      s.mode === "inbox" && h("label", null, "playlist ",
        h("input", { type: "text", value: s.playlist,
          onInput: (e) => { s.playlist = e.target.value; } })),
      h("div", { class: "spacer" }),
      h("button", { onClick: scan, disabled: s.busy }, s.busy ? "Scanning…" : "Scan")),
    h("div", { class: "muted", style: { marginTop: "8px" } },
      "Dry-run — Scan never changes anything. Review, untick rows, then Apply."));
}

function dropzone() {
  const pick = h("input", { id: "filepick", type: "file", multiple: true,
    style: { display: "none" },
    onChange: (e) => { if (e.target.files.length) upload(e.target.files); } });
  const dz = h("div", { class: "dropzone" },
    "Drop audio files here to stage them in the Inbox, then Scan an inbox plan.", pick);
  dz.addEventListener("dragover", (e) => { e.preventDefault(); dz.classList.add("over"); });
  dz.addEventListener("dragleave", () => dz.classList.remove("over"));
  dz.addEventListener("drop", (e) => {
    e.preventDefault(); dz.classList.remove("over");
    if (e.dataTransfer.files.length) upload(e.dataTransfer.files);
  });
  dz.addEventListener("click", (e) => { if (e.target !== pick) pick.click(); });
  return h("div", { class: "panel" }, dz);
}

function planTable(s) {
  const actions = s.plan.actions;
  const allOn = actions.length > 0 && actions.every((a) => s.kept.has(a.id));
  const toggleAll = () => {
    s.kept = allOn ? new Set() : new Set(actions.map((a) => a.id)); render();
  };
  const toggle = (id) => {
    s.kept.has(id) ? s.kept.delete(id) : s.kept.add(id); render();
  };
  const rows = actions.map((a) =>
    h("tr", null,
      h("td", null, h("input", { type: "checkbox", checked: s.kept.has(a.id),
        onChange: () => toggle(a.id) })),
      h("td", null, h("span", { class: "badge " + a.kind }, a.kind)),
      h("td", { class: "path" }, a.src_rel, " ", h("span", { class: "arrow" }, "→"), " ", a.dest_rel),
      h("td", { class: "reason" }, a.reason)));
  return h("div", { class: "panel" },
    h("table", null,
      h("thead", null, h("tr", null,
        h("th", null, h("input", { type: "checkbox", checked: allOn, onChange: toggleAll })),
        h("th", null, "kind"), h("th", null, "from → to"), h("th", null, "reason"))),
      h("tbody", null, rows)),
    h("div", { class: "muted", style: { marginTop: "10px" } },
      s.kept.size + " of " + actions.length + " selected"));
}

function applyBar(s) {
  return h("div", { class: "panel row" },
    h("label", null, h("input", { type: "checkbox", checked: s.backup,
      onChange: (e) => { s.backup = e.target.checked; } }), " back up before apply"),
    h("div", { class: "spacer" }),
    h("button", { onClick: apply, disabled: s.busy || s.kept.size === 0 },
      "Apply " + s.kept.size + " change" + (s.kept.size === 1 ? "" : "s")));
}

function runsPanel(s) {
  if (!s.runs.length) return null;
  return h("div", { class: "panel runs" },
    h("div", { class: "muted", style: { marginBottom: "8px" } }, "Runs"),
    h("ul", { style: { listStyle: "none", margin: "0", padding: "0" } },
      s.runs.map((r) =>
        h("li", null,
          h("span", null, r.status === "applied" ? "✓" : r.status === "undone" ? "↺" : "…"),
          h("span", null, r.run_id),
          h("span", { class: "muted" }, r.n_actions + " actions"),
          h("div", { class: "spacer" }),
          r.undoable && h("button", { class: "secondary", onClick: () => undo(r.run_id) }, "Undo")))));
}

// --- render ----------------------------------------------------------------
function render() {
  const s = state;
  const hasPlan = s.plan && s.plan.actions.length > 0;
  const root = document.getElementById("root");
  root.replaceChildren(
    h("header", null,
      h("h1", null, "librarian"),
      h("span", { class: "root" }, s.cfg ? s.cfg.library_root : "…")),
    h("main", null,
      s.msg && h("div", { class: "banner " + s.msg.kind }, s.msg.text),
      organizePanel(s),
      modeBar(s),
      s.mode === "inbox" && dropzone(),
      hasPlan && planTable(s),
      hasPlan && applyBar(s),
      s.plan && s.plan.report_md && h("div", { class: "panel" }, h("pre", null, s.plan.report_md)),
      runsPanel(s)));
}

// --- actions ---------------------------------------------------------------
async function refreshRuns() {
  try { state.runs = (await api("/api/runs")).runs; render(); } catch (e) {}
}

async function organize() {
  if (!state.instruction.trim()) return;
  state.busy = true; state.msg = null; render();
  try {
    const p = await api("/api/organize", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ instruction: state.instruction }),
    });
    state.plan = p; state.kept = new Set(p.actions.map((a) => a.id));
    const lead = p.summary ? "Interpreted as: " + p.summary + " — " : "";
    state.msg = { kind: "ok", text: p.actions.length
      ? lead + p.actions.length + " change(s) proposed. Review and Apply."
      : lead + "nothing to change." };
  } catch (e) { state.msg = { kind: "bad", text: e.message }; state.plan = null; }
  finally { state.busy = false; render(); }
}

async function scan() {
  state.busy = true; state.msg = null; render();
  try {
    const p = await api("/api/plan", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mode: state.mode, organize_by_genre: state.organize, playlist: state.playlist }),
    });
    state.plan = p; state.kept = new Set(p.actions.map((a) => a.id));
    if (!p.actions.length) state.msg = { kind: "ok", text: "Nothing to do — already clean." };
  } catch (e) { state.msg = { kind: "bad", text: e.message }; state.plan = null; }
  finally { state.busy = false; render(); }
}

async function apply() {
  state.busy = true; state.msg = null; render();
  try {
    const r = await api("/api/apply", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ plan_id: state.plan.plan_id, keep_ids: [...state.kept], backup: state.backup }),
    });
    let t = "Applied " + r.applied + " actions (skipped " + r.skipped + "). Run " + r.run_id + ".";
    if (r.rekordbox_rewritten) t += " rekordbox XML updated.";
    state.msg = { kind: "ok", text: t }; state.plan = null; state.kept = new Set();
    await refreshRuns();
  } catch (e) { state.msg = { kind: "bad", text: e.message }; }
  finally { state.busy = false; render(); }
}

async function undo(run_id) {
  state.busy = true; state.msg = null; render();
  try {
    const r = await api("/api/undo", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ run_id }),
    });
    state.msg = { kind: "ok", text: "Undid " + run_id + ": reversed " + r.reverted + " actions." };
    await refreshRuns();
  } catch (e) { state.msg = { kind: "bad", text: e.message }; }
  finally { state.busy = false; render(); }
}

async function upload(fileList) {
  const fd = new FormData();
  for (const f of fileList) fd.append("files", f);
  try {
    const r = await api("/api/inbox/upload", { method: "POST", body: fd });
    state.msg = { kind: "ok", text: "Staged " + r.saved.length + " file(s) in Inbox"
      + (r.rejected.length ? ", rejected " + r.rejected.length : "") + ". Now Scan." };
    render();
  } catch (e) { state.msg = { kind: "bad", text: e.message }; render(); }
}

// --- boot ------------------------------------------------------------------
render();
api("/api/config").then((c) => { state.cfg = c; render(); })
  .catch((e) => { state.msg = { kind: "bad", text: e.message }; render(); });
refreshRuns();
</script>
</body>
</html>
