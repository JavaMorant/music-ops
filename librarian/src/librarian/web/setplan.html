<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>setplan — librarian</title>
<style>
  /* ── design tokens — duplicated verbatim across index/pulse/dedupe/setplan ── */
  :root {
    color-scheme: dark;
    --bg:#0a0b0e; --panel:#111318; --raised:#181b21; --inset:#07080b;
    --line:#20242c; --line-2:#2c313b;
    --text:#e9ebf1; --dim:#99a0ac; --faint:#606672;
    --accent:#7da7ff; --accent-ink:#071019;
    --ok:#56d38f; --warm:#e5ab5b; --bad:#f07d7d; --cold:#74b8d8;
    --accent-tint:rgba(125,167,255,.13); --ok-tint:rgba(86,211,143,.11);
    --warm-tint:rgba(229,171,91,.12); --bad-tint:rgba(240,125,125,.10);
    --move:var(--accent); --quarantine:var(--warm);
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --r-sm:7px; --r-md:11px; --r-lg:14px;
    --shadow-1:inset 0 1px 0 rgba(255,255,255,.03), 0 1px 2px rgba(0,0,0,.35);
    --shadow-2:0 12px 32px rgba(0,0,0,.45);
    --ease:cubic-bezier(.25,.6,.3,1);
  }
  * { box-sizing:border-box; }
  ::selection { background:rgba(125,167,255,.3); }
  *::-webkit-scrollbar { width:10px; height:10px; }
  *::-webkit-scrollbar-track { background:transparent; }
  *::-webkit-scrollbar-thumb { background:var(--line-2); border-radius:99px;
    border:3px solid transparent; background-clip:content-box; }
  @media (prefers-reduced-motion:reduce) {
    *, *::before, *::after { animation:none !important; transition:none !important; }
  }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.55 var(--font);
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }

  /* ── app bar (shared chrome, transcribed from pulse.html's bare `header` rule) ── */
  header { position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:14px;
    padding:10px 22px; border-bottom:1px solid var(--line);
    background:rgba(10,11,14,.82); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); }
  .brand { display:inline-flex; align-items:center; gap:9px; font-size:13.5px; font-weight:650;
    letter-spacing:.05em; color:var(--text); }
  .brand::before { content:""; width:9px; height:9px; border-radius:3px;
    background:linear-gradient(135deg,var(--accent),#5b74d6);
    box-shadow:0 0 8px rgba(125,167,255,.45); }
  .tabs { display:flex; gap:2px; padding:3px; border:1px solid var(--line); border-radius:10px;
    background:rgba(255,255,255,.02); }
  .tab { display:inline-flex; align-items:center; gap:7px; text-decoration:none; color:var(--dim);
    font-size:12.5px; font-weight:600; padding:5px 12px; border-radius:7px; line-height:1.4;
    transition:color .14s var(--ease), background .14s var(--ease); }
  .tab:hover { color:var(--text); }
  .tab.active { color:var(--text); background:var(--raised); box-shadow:var(--shadow-1); }
  .tab .dot { width:6px; height:6px; border-radius:50%; opacity:.4; transition:opacity .14s var(--ease); }
  .tab.active .dot { opacity:1; }
  .spacer { flex:1; }

  /* ── main column (pulse.html's bare `main` rule, aliased to .wrap — pulse has
     no literal .wrap class, this is the closest equivalent) ───────────────── */
  .wrap { max-width:1080px; margin:0 auto; padding:24px 24px 90px; transition:opacity .2s var(--ease); }

  /* ── sections ──────────────────────────────────────────────────────────── */
  .kicker { display:flex; align-items:baseline; gap:10px; margin:26px 0 10px;
    font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); }
  .kicker:first-child { margin-top:2px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:var(--r-md);
    padding:16px 18px; margin-bottom:14px; box-shadow:var(--shadow-1); }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .muted { color:var(--dim); font-size:12px; }
  .muted b { color:var(--text); font-weight:600; }

  /* ── controls ──────────────────────────────────────────────────────────── */
  .field { background:var(--inset); border:1px solid var(--line); color:var(--text);
    border-radius:var(--r-sm); padding:8px 11px; font:13px/1.4 var(--font);
    transition:border-color .14s var(--ease), box-shadow .14s var(--ease); }
  .field:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-tint); }
  .field.mono { font:12px/1.5 var(--mono); }
  .field::placeholder { color:var(--faint); }
  .grow { flex:1; min-width:220px; }
  /* the setplan form wraps <label class="field"> around its inputs (a compact
     labeled-control pattern not used elsewhere in the app) — supplemental rules
     so the nested control blends into the pill instead of double-boxing */
  label.field { display:inline-flex; align-items:center; gap:6px; color:var(--dim);
    font-size:11px; font-weight:650; letter-spacing:.06em; text-transform:uppercase; cursor:text; }
  label.field input, label.field select { background:transparent; border:0; color:var(--text);
    font:13px/1.4 var(--font); text-transform:none; letter-spacing:normal; font-weight:500;
    padding:0; outline:none; }
  label.field input[type=number] { width:5ch; }
  label.field input[type=range] { width:110px; accent-color:var(--accent); }
  label.field.grow { flex:1; min-width:220px; }
  label.field.grow input { width:100%; }

  /* .btn/.btn-primary — pulse.html has no literal .btn class (it styles a bare
     `button` element as primary and `button.ghost` as secondary); these are the
     closest equivalents, transcribed from those two rule blocks. */
  .btn { font:600 13px/1.4 var(--font); letter-spacing:.01em; text-decoration:none;
    display:inline-flex; align-items:center; background:transparent; color:var(--text);
    border:1px solid var(--line-2); border-radius:var(--r-sm); padding:7px 15px; cursor:pointer;
    transition:filter .14s var(--ease), transform .14s var(--ease), background .14s var(--ease); }
  .btn:hover { background:var(--raised); }
  .btn:active { transform:translateY(1px); }
  .btn-primary { background:var(--accent); color:var(--accent-ink); border:0;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.2), 0 1px 2px rgba(0,0,0,.3); }
  .btn-primary:hover { filter:brightness(1.08); background:var(--accent); }
  .btn-primary:active { filter:brightness(.95); }

  .pill { font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    padding:2px 8px; border-radius:99px; background:var(--accent-tint); color:var(--accent);
    line-height:1.6; white-space:nowrap; }
  .pill.warm { background:var(--warm-tint); color:var(--warm); }

  /* ── feedback ──────────────────────────────────────────────────────────── */
  .banner { display:flex; gap:10px; align-items:flex-start; padding:11px 14px;
    border-radius:var(--r-sm); border:1px solid; margin:10px 0; font-size:13px; }
  .banner::before { font-weight:700; line-height:1.55; }
  .banner.ok { background:var(--ok-tint); color:var(--ok); border-color:rgba(86,211,143,.25); }
  .banner.ok::before { content:"✓"; }
  .banner.bad { background:var(--bad-tint); color:var(--bad); border-color:rgba(240,125,125,.25); }
  .banner.bad::before { content:"✕"; }

  /* ── setplan-specific ──────────────────────────────────────────────────── */
  .slot{display:flex;gap:12px;align-items:baseline;padding:9px 12px;border-bottom:1px solid var(--line)}
  .slot:hover{background:var(--raised)}
  .slot .n{color:var(--faint);min-width:2ch;text-align:right;font-variant-numeric:tabular-nums}
  .slot .clock{color:var(--dim);min-width:5ch;font-variant-numeric:tabular-nums}
  .slot .name{flex:1}
  .slot .badge{font:12px var(--mono);color:var(--dim);background:var(--inset);
    border:1px solid var(--line);border-radius:var(--r-sm);padding:2px 7px}
  .slot .why{display:block;color:var(--faint);font-size:12px;margin-top:2px}
  .slot.anchor .name::before{content:"⭐ ";color:var(--warm)}
  .slot .lock{accent-color:var(--accent)}
  details.alts{margin:2px 0 0 0}
  details.alts summary{color:var(--faint);font-size:12px;cursor:pointer}
  .toolbar{display:flex;gap:10px;align-items:center;margin:14px 0}
</style>
</head>
<body>
<header>
  <span class="brand">librarian</span>
  <nav class="tabs">
    <a class="tab" href="/"><span class="dot" style="background:#7da7ff"></span>Review</a>
    <a class="tab" href="/pulse.html"><span class="dot" style="background:#56d38f"></span>Pulse</a>
    <a class="tab" href="/dedupe.html"><span class="dot" style="background:#e5ab5b"></span>Duplicates</a>
    <a class="tab active" href="/setplan.html"><span class="dot" style="background:#b98ede"></span>Setplan</a>
  </nav>
</header>
<main class="wrap">
  <div class="kicker">PLAN A SET <span class="muted">— harmonic + BPM arc + your own play history</span></div>
  <form id="spForm" class="panel" onsubmit="return runPlan(event)">
    <div class="row">
      <label class="field">minutes <input id="spMin" type="number" value="90" min="10" max="360"></label>
      <label class="field grow">journey <input id="spJourney" placeholder="amapiano:60,afrobeats:40"></label>
      <label class="field">arc
        <select id="spArc"><option>peak</option><option>warmup</option><option>build</option><option>closing</option><option>journey</option></select></label>
      <label class="field">harmonic
        <select id="spHarm"><option>loose</option><option>strict</option><option>off</option></select></label>
      <label class="field">freshness <input id="spFresh" type="range" min="0" max="1" step="0.05" value="0.3"></label>
    </div>
    <div class="row" style="align-items:center">
      <label style="display:flex;align-items:center;gap:8px;color:var(--text);cursor:pointer">
        <input type="checkbox" id="spCatalogue" checked> limit to my catalogue <span class="muted">(tracks I own)</span>
      </label>
      <span class="muted">off = also suggest tracks to acquire — coming soon</span>
    </div>
    <div class="row">
      <label class="field grow">must-play <input id="spMust" placeholder="comma-separated queries"></label>
      <label class="field grow">avoid <input id="spAvoid" placeholder="tracks / artists / genres"></label>
      <label class="field grow">opener <input id="spOpener"></label>
      <button class="btn btn-primary" type="submit" id="spGo">Build set</button>
    </div>
  </form>
  <div id="spOut"></div>
</main>
<script>
let PLAN = null;
const $ = id => document.getElementById(id);
const esc = s => (s ?? "").toString().replace(/[&<>"']/g, m =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

function req() {
  return {
    minutes: +$("spMin").value, journey: $("spJourney").value.trim(),
    arc: $("spArc").value, harmonic: $("spHarm").value, freshness: +$("spFresh").value,
    must: $("spMust").value.split(",").map(s=>s.trim()).filter(Boolean),
    avoid: $("spAvoid").value.split(",").map(s=>s.trim()).filter(Boolean),
    opener: $("spOpener").value.trim() || null,
    catalogue_only: $("spCatalogue").checked,
  };
}
async function runPlan(e) {
  e.preventDefault();
  $("spOut").innerHTML = '<div class="banner">building…</div>';
  const r = await fetch("/api/setplan", {method:"POST",
    headers:{"Content-Type":"application/json"}, body: JSON.stringify(req())});
  if (!r.ok) {
    let msg = "HTTP " + r.status;
    try { const j = await r.json(); msg = typeof j.detail === "string" ? j.detail
      : Array.isArray(j.detail) ? j.detail.map(d => d.msg || JSON.stringify(d)).join("; ")
      : JSON.stringify(j.detail || j); } catch (e) {}
    $("spOut").innerHTML = `<div class="banner bad">${esc(msg)}</div>`;
    return false;
  }
  PLAN = (await r.json()).plan;
  render();
  return false;
}
function locks() {
  const out = {};
  document.querySelectorAll(".lock:checked").forEach(cb => { out[+cb.dataset.i] = cb.dataset.path; });
  return out;
}
async function reroll(fromSlot) {
  const body = {locks: locks()};
  if (fromSlot != null) body.from_slot = fromSlot;
  const r = await fetch(`/api/setplan/${PLAN.id}/reroll`, {method:"POST",
    headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)});
  if (r.ok) { PLAN = (await r.json()).plan; render(); }
}
function render() {
  const cat = (PLAN.spec && PLAN.spec.catalogue_only === false)
    ? `<div class="banner">💡 suggesting tracks beyond your library is coming soon — this set is from your library</div>` : "";
  const w = cat + (PLAN.unmatched.length
    ? `<div class="banner bad">no match: ${PLAN.unmatched.map(esc).join(" · ")}</div>` : "");
  const rows = PLAN.slots.map(s => {
    const c = s.candidate;
    const key = c.camelot ? c.camelot[0] + c.camelot[1] : "—";
    const bpm = c.bpm ? Math.round(c.bpm) : "—";
    const anchor = s.reason.startsWith("⭐");
    const alts = s.alternates.length
      ? `<details class="alts"><summary>${s.alternates.length} alternates</summary>` +
        s.alternates.map(a =>
          `<div class="why">↳ ${esc(a.candidate.artist)} — ${esc(a.candidate.title)} · ${esc(a.reason)}
             <button class="btn" data-swap-i="${s.index}" data-swap-path="${esc(a.candidate.path)}">use</button></div>`).join("") +
        `</details>` : "";
    return `<div class="slot${anchor ? " anchor" : ""}">
      <span class="n">${s.index + 1}</span><span class="clock">+${Math.round(s.clock_min)}m</span>
      <span class="name">${esc(c.artist)} — ${esc(c.title)}
        <span class="why">${esc(s.reason)}</span>${alts}</span>
      <span class="badge">${bpm} · ${key}</span>
      <label><input type="checkbox" class="lock" data-i="${s.index}" data-path="${esc(c.path)}"> lock</label>
      <button class="btn" onclick="reroll(${s.index + 1})">reroll ↓</button>
    </div>`;
  }).join("");
  $("spOut").innerHTML = `${w}
    <div class="toolbar">
      <span class="pill">plan ${esc(PLAN.id)}</span>
      <button class="btn" onclick="reroll(null)">Reroll (respect locks)</button>
      <a class="btn" href="/api/setplan/${esc(PLAN.id)}/export?fmt=m3u8">m3u8</a>
      <a class="btn" href="/api/setplan/${esc(PLAN.id)}/export?fmt=md">markdown</a>
      <a class="btn" href="/api/setplan/${esc(PLAN.id)}/export?fmt=xml">rekordbox xml</a>
    </div>
    <div class="panel" style="padding:0">${rows}</div>`;
}
async function swap(i, path) {
  const l = locks(); l[i] = path;
  const r = await fetch(`/api/setplan/${PLAN.id}/reroll`, {method:"POST",
    headers:{"Content-Type":"application/json"}, body: JSON.stringify({locks: l})});
  if (r.ok) { PLAN = (await r.json()).plan; render(); }
}
// Delegated: swap buttons carry data-* payloads — never build JS source from data (XSS).
document.getElementById("spOut").addEventListener("click", (e) => {
  const b = e.target.closest("[data-swap-i]");
  if (b) swap(+b.dataset.swapI, b.dataset.swapPath);
});
</script>
</body>
</html>
