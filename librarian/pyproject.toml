[project]
name = "librarian"
version = "0.1.0"
description = "DJ library organiser: a reversible plan/apply/undo engine for the music library"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "mutagen>=1.47",
]

[project.optional-dependencies]
# rekordbox XML cue-safety is plain ElementTree, so the CLI core stays light.
# pyrekordbox reads the rekordbox DB for playlist lookup (dedupe.py) and the pulse
# play-history features; it ships with the web extra because that is where those
# routes live. Reading DB BPM/key is still a later slice.
dev = ["pytest>=8.0", "httpx>=0.27"]
web = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9", "pyrekordbox>=0.4"]
# Ambition-tier `organize`: natural-language → rule-set via Claude. Opt-in so the
# core install stays light; the deterministic `cleanup` is the non-AI equivalent.
ai = ["anthropic>=0.40"]

[project.scripts]
librarian = "librarian.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
librarian = ["web/index.html"]
