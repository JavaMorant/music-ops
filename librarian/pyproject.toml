[project]
name = "librarian"
version = "0.1.0"
description = "DJ library organiser: a reversible plan/apply/undo engine for the music library"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "mutagen>=1.47",
]

[project.optional-dependencies]
# pyrekordbox lands in a later slice (rekordbox DB analysis). The engine needs
# none of it — rekordbox XML cue-safety is plain ElementTree — so the core stays
# light. The web review app is an opt-in extra so the CLI install stays minimal.
dev = ["pytest>=8.0", "httpx>=0.27"]
web = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]

[project.scripts]
librarian = "librarian.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
librarian = ["web/index.html"]
