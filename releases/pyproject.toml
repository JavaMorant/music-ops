[project]
name = "releases"
version = "0.1.0"
description = "Release tracker + pipeline: turn idle ProducerLibrary projects into a shipping schedule"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
]

[project.optional-dependencies]
# The scan is pure stdlib (os.walk + sqlite3). The AI 'what-it-needs-to-ship'
# estimator (ambition tier, flagged) is the only thing that needs the API client,
# so it stays optional and the core install stays tiny.
dev = ["pytest>=8.0", "mutagen>=1.47", "fastapi>=0.111", "httpx>=0.27"]
# Writing ID3 genre / mix-master tags (the Track-List organizer) needs mutagen.
tags = ["mutagen>=1.47"]
# The local Track List web app (releases web) is an opt-in extra.
web = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "mutagen>=1.47"]
ai = ["anthropic>=0.39"]
# Auto stem separation (the interactive stem player) needs Demucs + PyTorch —
# heavy and slow on CPU, so it's a clearly-optional extra.
stems = ["demucs>=4.0"]

[project.scripts]
releases = "releases.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
releases = ["web/index.html", "web/deck/*"]
