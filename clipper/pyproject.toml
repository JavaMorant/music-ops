[project]
name = "clipper"
version = "0.1.0"
description = "Content engine: turn long set recordings into ready-to-post short clips"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "librosa>=0.10",
    "numpy>=1.26",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
clipper = "clipper.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
